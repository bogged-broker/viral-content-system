apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-extractor
  namespace: default
  labels:
    app: audio-extractor
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audio-extractor
  template:
    metadata:
      labels:
        app: audio-extractor
        version: v1.0.0
    spec:
      containers:
      - name: audio-extractor
        image: audio-extractor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8088
          name: http
          protocol: TCP
        - containerPort: 8000
          name: metrics
          protocol: TCP
        env:
        - name: CONTAINER_MODE
          value: "true"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: AUTOSCALING_ENABLED
          value: "true"
        - name: MAX_CONCURRENT_EXTRACTIONS
          value: "50"
        - name: MIN_CONCURRENT_EXTRACTIONS
          value: "2"
        - name: STORAGE_BACKEND
          value: "gcs"
        - name: GCS_BUCKET
          value: "audio-extractor-storage"
        - name: BUILD_INTEGRITY_ENABLED
          value: "true"
        - name: TELEMETRY_HTTP_ENABLED
          value: "true"
        - name: TELEMETRY_HTTP_PORT
          value: "8088"
        - name: PROMETHEUS_PORT
          value: "8000"
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8088
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8088
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: config-volume
          mountPath: /etc/audio_extractor
          readOnly: true
        - name: secrets-volume
          mountPath: /etc/audio_extractor/secrets
          readOnly: true
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: audio-extractor-data-pvc
      - name: config-volume
        configMap:
          name: audio-extractor-config
      - name: secrets-volume
        secret:
          secretName: audio-extractor-secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: audio-extractor-service
  namespace: default
  labels:
    app: audio-extractor
spec:
  type: ClusterIP
  ports:
  - port: 8088
    targetPort: 8088
    name: http
  - port: 8000
    targetPort: 8000
    name: metrics
  selector:
    app: audio-extractor
---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: audio-extractor-monitor
  namespace: default
  labels:
    app: audio-extractor
spec:
  selector:
    matchLabels:
      app: audio-extractor
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audio-extractor-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audio-extractor
  minReplicas: 2
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 10
        periodSeconds: 15
      selectPolicy: Max
